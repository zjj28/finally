<!DOCTYPE html>
<html style="height: 100%">

<head>
    <meta charset="UTF-8" />
    <title>站点信息</title>
    <script src="./static/js/jquery-3.6.0.js"></script>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/echarts-nightly@5.1.2-dev.20210512/dist/echarts.min.js"></script>
    <script type="text/javascript"
        src="https://api.map.baidu.com/api?v=3.0&ak=5c3qkRhHUBf4eokNGVi13AACExyU0nhs"></script>
    <script type="text/javascript" src="./static/js/bmap.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* 基础样式 */
        * {
            text-decoration: none !important;
        }


        /* 导航栏容器 */
        .shell {
            width: 80px;
            height: 525px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgb(17, 24, 39);
            border-radius: 0 10px 10px 0;
            /* 仅右侧圆角 */
            transition: 0.3s;
            overflow: hidden;
            padding-bottom: 10px;
            position: fixed;
            /* 固定定位 */
            z-index: 1000;
            left: 0;
            /* 紧贴左侧 */
            top: 50%;
            /* 垂直居中 */
            transform: translateY(-50%);
            /* 精确居中 */
        }

        /* 导航项 */
        .box {
            display: block;
            height: 15%;
            width: 85%;
            margin: 9px;
            border-radius: 5px;
            position: relative;
            transition: 0.3s;
            color: rgb(160, 160, 175);
        }

        /* 图标基础样式 */
        .box i {
            position: absolute;
        }

        /* 第一个导航项下方的分隔线 */
        .box:nth-child(1)::before {
            content: '';
            display: block;
            width: 100%;
            height: 2px;
            background-color: rgb(55, 65, 81);
            position: absolute;
            bottom: -10px;
        }

        /* 导航文字 */
        .box span {
            position: relative;
            top: 22px;
            left: 80px;
            font: 500 20px '';
            opacity: 0;
            transition: 0.1s;
        }

        /* 悬停效果 */
        .shell:hover {
            width: 270px !important;
        }

        .box:hover {
            background-color: rgb(55, 65, 81);
            color: #fff;
        }

        .shell:hover span {
            opacity: 1;
        }

        /* 各个图标的单独样式 */
        .box:nth-child(1) i {
            font-size: 33px;
            margin: 20px 0 0 15px;
        }

        .box:nth-child(2) i {
            font-size: 35px;
            margin: 20px 0 0 20px;
            color: #fff !important;

        }

        .box:nth-child(3) i {
            font-size: 33px;
            margin: 20px 0 0 20px;
        }

        .box:nth-child(4) i {
            font-size: 30px;
            margin: 20px 0 0 16px;
        }

        .box:nth-child(5) i {
            font-size: 30px;
            margin: 20px 0 0 16px;
        }

        .box:nth-child(6) i {
            font-size: 30px;
            margin: 20px 0 0 16px;
        }
    </style>
</head>



<body style="height: 92%; margin: 0">

    <!-- 查询路线表单 -->
    <div class="shell">
        <a href="/index" class="box"><i class="fas fa-home feature-icon"></i><span>首页</span></a>
        <a href="/StationVis" class="box"><i class="fas fa-map-marker-alt feature-icon"></i><span>站点信息</span></a>
        <a href="/TrainVis" class="box"><i class="fas fa-train feature-icon"></i><span>列车信息</span></a>
        <a href="/AccessVis" class="box"><i class="fas fa-project-diagram feature-icon"></i><span>站点可达性</span></a>
        <a href="/ChartVis" class="box"><i class="fas fa-network-wired feature-icon"></i><span>站点关联关系</span></a>
        <a href="/PathVis" class="box"><i class="fas fa-route feature-icon"></i><span>路径规划</span></a>
    </div>

    <div id="main" style="height: 100%; margin: 0"></div>
    <script type="text/javascript">
        var chartDom = document.getElementById('main');
        var myChart = echarts.init(chartDom);
        var option;

        // 获取数据并处理为echarts所需形式
        $.get('static/data/StationInfo.json', function (data) {

            var points = [].concat(data.map(function (track) {
                var ls = [track.lon, track.lat];
                if (track.trains == undefined)
                    ls.push([]);
                else
                    ls.push(Object.values(track.trains).length);
                var dic = { name: track.name, value: ls };
                return dic;
            }));
            // 筛选出value最大的500个点
            points = points.sort(function (a, b) {
                return b.value[2] - a.value[2];
            }).slice(0, 500);

            myChart.setOption(option = {
                tooltip: {
                    trigger: 'item'
                },
                bmap: {
                    center: [104.114129, 37.550339],
                    zoom: 6,
                    roam: true
                },
                visualMap: {
                    show: true,
                    top: 'bottom',
                    left: 'right',
                    min: 50,
                    max: 700,
                    seriesIndex: 0,
                    calculable: true,
                    inRange: {
                        color: ['blue', 'green', 'yellow', 'red']
                    }
                },
                series: [
                    {
                        type: 'scatter',
                        coordinateSystem: 'bmap',
                        data: points,
                        symbolSize: function (val) {
                            return val[2] / 12;
                        },
                        encode: {
                            value: 2
                        },
                        label: {
                            formatter: '{b}',
                            position: 'right',
                            show: false
                        },
                        emphasis: {
                            label: {
                                show: true
                            }
                        }
                    },
                ]
            });
            //  添加百度地图插件
            var bmap = myChart.getModel().getComponent('bmap').getBMap();
            bmap.setMapStyleV2({
                styleId: 'b0a8cb25619b8aec496dfadbcfb706c6'
            });
            bmap.enableScrollWheelZoom(true)
            var scaleCtrl = new BMap.ScaleControl();  // 添加比例尺控件
            bmap.addControl(scaleCtrl);
        });

        if (option && typeof option === 'object') {
            myChart.setOption(option);
        }

    </script>
</body>

</html>
